server {
    # Cloud Run enruta el tráfico al puerto 8080 del contenedor.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre: caché agresiva e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA: cualquier ruta desconocida sirve index.html
    # (necesario para el routing de cliente con React Router / BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cachear el HTML para que siempre tome la última versión
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
